<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoCo POS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/zoco-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZoCo">
<meta name="theme-color" content="#0F172A">
<script>
  // Guarda el evento de instalación desde el primer instante (Chrome lo dispara una sola vez)
  window.__bip = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__bip = e;
    window.dispatchEvent(new Event('zoco:installable'));
  });
  // Diagnóstico: cualquier error de JavaScript queda visible en <html data-err="...">
  window.__errs = [];
  window.addEventListener('error', function (e) {
    try {
      window.__errs.push((e.message || 'error') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      document.documentElement.dataset.err = window.__errs.join(' | ').slice(0, 400);
    } catch (_) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try {
      window.__errs.push('rechazo: ' + ((e.reason && e.reason.message) || e.reason));
      document.documentElement.dataset.err = window.__errs.join(' | ').slice(0, 400);
    } catch (_) {}
  });
</script>
<link rel="stylesheet" href="./css/tokens.css?v=8">
<link rel="stylesheet" href="./css/app.css?v=51">
<link rel="stylesheet" href="./css/landing.css?v=3">
</head>
<body>
<div id="zoco-startup" role="status" aria-label="Iniciando ZoCo POS">
  <div class="startup-fallback" aria-hidden="true"></div>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
  // Mantener visible la presentación al menos 2.5 s, sin ocultar errores de carga.
  (function () {
    const startedAt = performance.now();
    const minDuration = 4000;
    const app = document.getElementById('app');
    let ready = false;
    let hidden = false;
    const hide = () => {
      if (hidden || !ready) return;
      const remaining = Math.max(0, minDuration - (performance.now() - startedAt));
      setTimeout(() => {
        if (hidden) return;
        hidden = true;
        document.getElementById('zoco-startup')?.classList.add('startup-done');
      }, remaining);
    };
    const observer = new MutationObserver(() => {
      if (app.children.length) { ready = true; observer.disconnect(); hide(); }
    });
    observer.observe(app, {childList:true});
    if (app.children.length) { ready = true; observer.disconnect(); hide(); }
    // En caso de un error, no dejar el inicio tapando la interfaz indefinidamente.
    setTimeout(() => {
      observer.disconnect();
      ready = true;
      hide();
    }, 9000);
    // Si el módulo principal no logra pintar, ofrecer recuperación sin borrar datos.
    setTimeout(() => {
      if (app.children.length) return;
      const existing = document.getElementById('zoco-boot-diagnostic');
      if (existing) return;
      document.getElementById('zoco-startup')?.classList.add('startup-done');
      const panel = document.createElement('div');
      panel.id = 'zoco-boot-diagnostic';
      panel.style.cssText = 'position:relative;z-index:100;max-width:440px;margin:12vh auto 20px;padding:24px;border-radius:20px;background:#fff;color:#172033;box-shadow:0 10px 40px #0002;font:15px/1.5 system-ui,sans-serif';
      const title = document.createElement('h2');
      title.textContent = 'ZoCo no pudo iniciar';
      const msg = document.createElement('p');
      msg.textContent = 'No borres los datos de la aplicación. Puedes reintentar la carga sin eliminar tus ventas guardadas.';
      const detail = document.createElement('pre');
      detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#9f1239';
      detail.textContent = (window.__errs || []).join(' | ') || 'No se detectó un error específico. Revisa la conexión o intenta actualizar.';
      const retry = document.createElement('button');
      retry.textContent = 'Reintentar sin borrar datos';
      retry.style.cssText = 'background:#f97316;color:white;border:0;border-radius:12px;padding:14px;width:100%;font-weight:700';
      retry.onclick = () => {
        const url = new URL(location.href);
        url.searchParams.set('reload', String(Date.now()));
        location.replace(url.href);
      };
      panel.append(title, msg, detail, retry);
      document.body.append(panel);
    }, 12000);
  })();
</script>
<script src="./js/config.js"></script>
<script type="module" src="./js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
