<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoCo POS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/zoco-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZoCo">
<meta name="theme-color" content="#0F172A">
<script>
  // Guarda el evento de instalación desde el primer instante (Chrome lo dispara una sola vez)
  window.__bip = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__bip = e;
    window.dispatchEvent(new Event('zoco:installable'));
  });
  // Diagnóstico: cualquier error de JavaScript queda visible en <html data-err="...">
  window.__errs = [];
  window.addEventListener('error', function (e) {
    try {
      window.__errs.push((e.message || 'error') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
      document.documentElement.dataset.err = window.__errs.join(' | ').slice(0, 400);
    } catch (_) {}
  });
  window.addEventListener('unhandledrejection', function (e) {
    try {
      window.__errs.push('rechazo: ' + ((e.reason && e.reason.message) || e.reason));
      document.documentElement.dataset.err = window.__errs.join(' | ').slice(0, 400);
    } catch (_) {}
  });
</script>
<link rel="stylesheet" href="./css/tokens.css?v=8">
<link rel="stylesheet" href="./css/app.css?v=45">
</head>
<body>
<div id="zoco-startup" role="status" aria-label="Iniciando ZoCo POS">
  <div class="startup-content">
    <img class="startup-mark" src="/zoco-icon.svg" alt="ZoCo">
    <div class="startup-name">ZoCo</div><div class="startup-pos">POS</div>
    <div class="startup-sub">Inventario · Ventas · Catálogo · Reportes</div>
  </div>
  <div class="startup-loading"><span class="startup-spinner"></span><span>Iniciando ZoCo...</span></div>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
  // Desaparece en cuanto la aplicación muestra contenido, sin imponer una espera artificial.
  (function () {
    const hide = () => { const s = document.getElementById('zoco-startup'); if (s) s.classList.add('startup-done'); };
    const app = document.getElementById('app');
    const observer = new MutationObserver(() => { if (app.children.length) { observer.disconnect(); requestAnimationFrame(() => setTimeout(hide, 180)); } });
    observer.observe(app, {childList:true});
    if (app.children.length) hide();
    setTimeout(() => { observer.disconnect(); hide(); }, 9000);
  })();
</script>
<script src="./js/config.js"></script>
<script type="module" src="./js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
