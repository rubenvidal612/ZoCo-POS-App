<!doctype html>
<html lang="es" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZoCo Chat</title>
<link rel="manifest" href="/chat.webmanifest">
<link rel="icon" href="/zoco-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZoCo Chat">
<meta name="theme-color" content="#0F172A">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{display:flex;flex-direction:column}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0F172A;color:#fff;flex:0 0 auto}
  .chat-head img{width:32px;height:32px;border-radius:9px}
  .chat-head b{font-size:15px}
  .chat-head .sp{flex:1}
  .chat-head a{color:#CBD5E1;font-size:11.5px;text-decoration:none;border:1px solid rgba(255,255,255,.15);
    padding:6px 10px;border-radius:9px}
  #app{flex:1;min-height:0;display:flex;padding:10px}
  #app > *{flex:1;min-height:0}
  .ai-wrap{height:100%}
  @media (max-width:900px){ #app{padding:0} }
</style>
</head>
<body>
<div class="chat-head">
  <img src="/zoco-192.png" alt="ZoCo">
  <b>ZoCo Chat</b>
  <div class="sp"></div>
  <a href="/">Abrir POS</a>
</div>
<div id="app"></div>

<script type="module">
  import { hydrate } from '/js/store.js';
  import { aiView } from '/js/views-ai.js';

  await hydrate();
  const view = aiView();
  document.querySelector('#app').appendChild(view.root);
</script>
</body>
</html>
