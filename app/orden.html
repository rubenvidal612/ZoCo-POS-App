<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de tu orden · ZoCo</title>
<meta name="theme-color" content="#F97316">
<link rel="icon" href="/zoco-icon.svg" type="image/svg+xml">
<style>
  :root{--brand:#F97316;--ink:#0F172A;--mut:#64748B;--line:#E7EAF0;--ok:#059669}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#F8FAFC;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
  .wrap{max-width:460px;margin:0 auto;padding:22px 18px 40px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;letter-spacing:-.3px;margin-bottom:18px}
  .brand i{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
  .folio{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--mut);text-transform:uppercase}
  h1{font-size:23px;margin:6px 0 4px;letter-spacing:-.6px}
  .sub{color:var(--mut);font-size:13.5px;margin:0 0 16px}
  .estado{display:flex;align-items:center;gap:10px;border-radius:14px;padding:14px 16px;margin:14px 0 18px;background:#FFF7ED;border:1px solid #FED7AA}
  .estado .dot{width:11px;height:11px;border-radius:50%;background:var(--brand);flex:none}
  .estado b{font-size:16.5px;letter-spacing:-.3px}
  .estado.listo{background:#ECFDF5;border-color:#A7F3D0}
  .estado.listo .dot{background:var(--ok)}
  .estado.entregado{background:#EEF2FF;border-color:#C7D2FE}
  .estado.entregado .dot{background:#4338CA}
  .pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 18px}
  .paso{text-align:center;font-size:10.5px;color:var(--mut);font-weight:700}
  .paso i{display:block;height:6px;border-radius:99px;background:#E9EDF3;margin-bottom:6px}
  .paso.on i{background:var(--brand)}
  .paso.on{color:var(--ink)}
  .filas{border-top:1px solid var(--line);margin-top:6px}
  .fila{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .fila span{color:var(--mut)}
  .fila b{text-align:right}
  .pie{margin-top:18px;font-size:11.5px;color:#94A3B8;text-align:center;line-height:1.5}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--brand);color:#fff;font-weight:800;
    padding:13px;border-radius:12px;margin-top:16px;font-size:14.5px}
  .err{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
  .spin{width:18px;height:18px;border:2.5px solid #E2E8F0;border-top-color:var(--brand);border-radius:50%;
    animation:g .8s linear infinite;margin:26px auto}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i>Z</i> ZoCo</div>
  <div class="card" id="card">
    <div class="spin"></div>
  </div>
  <p class="pie">Esta página muestra únicamente el estado de tu orden.<br>ZoCo POS · punto de venta</p>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var folio = (p.get('f') || '').trim().toUpperCase();
  var company = (p.get('c') || '').trim();
  var clave = (p.get('k') || '').trim();
  var card = document.getElementById('card');

  function pintar(d) {
    var orden = ['recibido', 'proceso', 'listo', 'entregado'];
    var idx = orden.indexOf(d.status);
    var etiquetas = ['Recibido', 'En proceso', 'Listo', 'Entregado'];
    card.innerHTML =
      '<div class="folio">Orden ' + d.folio + '</div>' +
      '<h1>' + d.negocio + '</h1>' +
      '<p class="sub">' + (d.prendas || 0) + ' prenda(s) en esta orden</p>' +
      '<div class="estado ' + d.status + '"><span class="dot"></span><b>' + d.statusLabel + '</b></div>' +
      '<div class="pasos">' + etiquetas.map(function (t, i) {
        return '<div class="paso ' + (i <= idx ? 'on' : '') + '"><i></i>' + t + '</div>';
      }).join('') + '</div>' +
      '<div class="filas">' +
        (d.recibido ? '<div class="fila"><span>Recibido</span><b>' + fecha(d.recibido) + '</b></div>' : '') +
        (d.listo ? '<div class="fila"><span>Listo</span><b>' + fecha(d.listo) + '</b></div>' : '') +
        (d.entregado ? '<div class="fila"><span>Entregado</span><b>' + fecha(d.entregado) + '</b></div>' : '') +
      '</div>' +
      (d.status === 'listo'
        ? '<a class="btn" href="https://wa.me/?text=' + encodeURIComponent('Voy por mi orden ' + d.folio) + '" target="_blank" rel="noopener">Avisar que voy en camino</a>'
        : '');
  }

  function fecha(iso) {
    try {
      return new Date(iso).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function error(msg, extra) {
    card.className = 'card err';
    card.innerHTML = '<h1>No encontramos tu orden</h1><p class="sub">' + msg + '</p>' +
      (extra ? '<p class="sub">' + extra + '</p>' : '');
  }

  if (!folio || !company) { error('Revisa el enlace o escanea de nuevo el código QR de tu ticket.'); return; }

  fetch('/api/tracking?c=' + encodeURIComponent(company) + '&f=' + encodeURIComponent(folio) + (clave ? '&k=' + encodeURIComponent(clave) : ''))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { error(d && d.error ? d.error : 'Puede que aún no esté registrada.', 'Pregunta en el mostrador con tu folio.'); return; }
      card.className = 'card';
      pintar(d);
    })
    .catch(function () { error('No hay conexión en este momento.', 'Intenta de nuevo en un momento.'); });
})();
</script>
</body>
</html>
