<!doctype html>
<html lang="es" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZoCo · Catálogo</title>
<link rel="icon" href="/zoco-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Temas ===== */
  :root,html[data-theme="claro"]{
    --bg:#FFFFFF; --head:rgba(255,255,255,.92); --card:#FFFFFF; --ink:#111827; --muted:#6B7280;
    --line:#E5E7EB; --accent:#111827; --accent-ink:#fff; --soft:#F3F4F6; --chip:#F3F4F6;
    --hero1:#F9FAFB; --hero2:#FFFFFF; --pic1:#F1F5F9; --pic2:#E2E8F0;
  }
  html[data-theme="cafe"]{
    --bg:#F7F1E8; --head:rgba(247,241,232,.92); --card:#FFFFFF; --ink:#2B1D14; --muted:#8A7A6D;
    --line:#EADFD2; --accent:#3B2416; --accent-ink:#fff; --soft:#F1E7DA; --chip:#F3EADF;
    --hero1:#EFE3D3; --hero2:#F7EFE4; --pic1:#EFE3D3; --pic2:#DCC9B3;
  }
  html[data-theme="rosa"]{
    --bg:#FFF6F9; --head:rgba(255,246,249,.92); --card:#FFFFFF; --ink:#4A1D2E; --muted:#9D6B7D;
    --line:#F6D9E3; --accent:#BE185D; --accent-ink:#fff; --soft:#FCE7EF; --chip:#FBE4EC;
    --hero1:#FDE7EF; --hero2:#FFF6F9; --pic1:#FBE0EA; --pic2:#F6C9D9;
  }
  html[data-theme="naranja"]{
    --bg:#FFF8F1; --head:rgba(255,248,241,.92); --card:#FFFFFF; --ink:#3B1E08; --muted:#9A7355;
    --line:#F8E2CD; --accent:#EA580C; --accent-ink:#fff; --soft:#FFEDD5; --chip:#FFE9D6;
    --hero1:#FFE8D2; --hero2:#FFF6EC; --pic1:#FFE3C7; --pic2:#FBCFA6;
  }
  html[data-theme="menta"]{
    --bg:#F2FBF7; --head:rgba(242,251,247,.92); --card:#FFFFFF; --ink:#0F3D2E; --muted:#5F8C7B;
    --line:#CFEADF; --accent:#0F766E; --accent-ink:#fff; --soft:#DCF5EA; --chip:#DFF4EB;
    --hero1:#DCF5EA; --hero2:#F2FBF7; --pic1:#D7F0E6; --pic2:#B9E3D3;
  }
  html[data-theme="noche"]{
    --bg:#0F172A; --head:rgba(15,23,42,.92); --card:#16202F; --ink:#F1F5F9; --muted:#94A3B8;
    --line:#243244; --accent:#F97316; --accent-ink:#fff; --soft:#1E293B; --chip:#1E293B;
    --hero1:#16202F; --hero2:#1B2637; --pic1:#1E293B; --pic2:#273549;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:90px;
    transition:background .25s,color .25s}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:40;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
  .logo{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1;color:var(--ink)}
  .logo span{color:var(--accent)}
  .searchbox{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:11px 16px;min-width:0}
  .searchbox input{border:0;outline:0;font-size:14px;width:100%;background:transparent;color:var(--ink)}
  .searchbox input::placeholder{color:var(--muted)}
  .links{display:flex;align-items:center;gap:16px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .links a{color:inherit;text-decoration:none}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;cursor:pointer;font-size:16px;color:var(--ink);text-decoration:none}
  .burger{display:none}
  #wa-mob{display:none}

  /* ---------- Selector de tema ---------- */
  .theme-wrap{position:relative}
  .themes{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:10px;display:none;gap:8px;box-shadow:0 16px 40px rgba(0,0,0,.14);z-index:60}
  .themes.open{display:flex}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
  .sw.on{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- Hero ---------- */
  .hero{max-width:1280px;margin:0 auto;padding:0 18px}
  .hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:10px;align-items:center;
    background:linear-gradient(100deg,var(--hero1),var(--hero2) 60%,var(--hero1));border-radius:14px;
    padding:34px 34px;overflow:hidden}
  .hero h1{font-family:'Playfair Display',Georgia,serif;font-size:44px;line-height:1.05;letter-spacing:-1px;margin-bottom:10px}
  .hero p{font-size:15px;color:var(--muted);max-width:380px}
  .hero-art{display:flex;justify-content:flex-end;gap:10px;align-items:flex-end}
  .hero-art img{width:120px;height:120px;object-fit:cover;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.12);background:var(--card)}
  .hero-art .ph{width:120px;height:120px;border-radius:16px;background:linear-gradient(140deg,var(--pic1),var(--pic2));
    display:grid;place-items:center;font-size:34px;color:#fff}

  /* ---------- Filtros ---------- */
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px}
  .filters::-webkit-scrollbar{height:0}
  .pill{white-space:nowrap;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;opacity:.9;transition:.15s}
  .pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
  .adv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
  .adv select{height:38px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
    font-size:13px;padding:0 14px;font-weight:600;cursor:pointer}
  .chip-x{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:12px;
    font-weight:700;cursor:pointer}
  .count{font-size:12.5px;color:var(--muted);margin:6px 0 12px}

  /* ---------- Grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;
    flex-direction:column;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
  .pic{position:relative;aspect-ratio:1/1;background:linear-gradient(140deg,var(--pic1),var(--pic2));display:grid;place-items:center}
  .pic img{width:100%;height:100%;object-fit:cover}
  .pic .ini{font-family:'Playfair Display',serif;font-size:44px;color:#fff;opacity:.92}
  .heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);
    display:grid;place-items:center;cursor:pointer;font-size:15px;color:#5C4A3C}
  .heart.on{color:#E11D48}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .name{font-family:'Playfair Display',Georgia,serif;font-size:18px;line-height:1.2;color:var(--ink)}
  .sub{font-size:12.5px;color:var(--muted)}
  .price{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.4px;color:var(--ink)}
  .sizes{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 10px}
  .sizes span{font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:7px;padding:3px 7px}
  .sizes .none{background:transparent;font-weight:600}
  .wa{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;
    border:1.5px solid #25D366;color:#128C4A;font-size:13.5px;font-weight:700;text-decoration:none;background:var(--card);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wa:hover{background:#F0FDF4}
  .wa b{font-weight:700}
  html[data-theme="noche"] .wa{color:#4ADE80;border-color:#22C55E}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

  .fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#25D366;
    color:#fff;display:grid;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 12px 28px rgba(37,211,102,.45);z-index:50}

  @media (max-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} .hero-in{grid-template-columns:1fr} .hero-art{display:none} }
  @media (max-width:760px){
    .bar{padding:12px 14px;gap:10px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"burger logo bag" "search search search";row-gap:10px;align-items:center}
    .burger{display:grid;place-items:center;width:34px;height:34px;border:0;background:none;font-size:20px;cursor:pointer;grid-area:burger;color:var(--ink)}
    .logo{font-size:24px;text-align:center;grid-area:logo}
    .links{display:none}
    .searchbox{grid-area:search;width:100%}
    #wa-mob{display:grid;grid-area:bag;margin:0;justify-self:end}
    .theme-wrap{grid-area:bag;justify-self:end;margin-right:44px}
    .hero{padding:0 14px}
    .hero-in{padding:22px 20px;margin-top:12px}
    .hero h1{font-size:31px}
    .hero p{font-size:13.5px}
    .wrap{padding:0 14px}
    .filters{padding:14px 0 4px;gap:7px}
    .pill{padding:9px 16px;font-size:13px}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .body{padding:11px 12px 13px}
    .name{font-size:15.5px}
    .sub{font-size:11px}
    .price{font-size:17px}
    .sizes span{font-size:10px;padding:2px 6px}
    .wa{height:38px;font-size:11px;border-radius:10px;gap:4px;padding:0 6px}
    .wa-full{display:none}
  }

  /* ---------- Tallas agotadas ---------- */
  .sizes span.out{text-decoration:line-through;opacity:.45}
  /* ---------- Ficha de producto ---------- */
  .ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:80;display:none;
    align-items:center;justify-content:center;padding:18px}
  .ov.open{display:flex}
  .sheet{background:var(--card);border-radius:22px;max-width:900px;width:100%;max-height:92vh;overflow:auto;
    display:grid;grid-template-columns:1fr 1fr;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .sheet-img{background:linear-gradient(140deg,var(--pic1),var(--pic2));display:grid;place-items:center;min-height:320px}
  .sheet-img img{width:100%;height:100%;object-fit:cover}
  .sheet-img .ini{font-family:'Playfair Display',serif;font-size:70px;color:#fff;opacity:.9}
  .sheet-body{padding:28px 26px;display:flex;flex-direction:column;gap:8px}
  .sheet-body h2{font-family:'Playfair Display',Georgia,serif;font-size:28px;line-height:1.15}
  .sheet-cat{font-size:13px;color:var(--muted)}
  .sheet-price{font-size:30px;font-weight:800;margin:6px 0 2px}
  .sheet-desc{font-size:13.5px;color:var(--muted);line-height:1.5}
  .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
  .picks{display:flex;gap:8px;flex-wrap:wrap}
  .pick{min-width:46px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    font-size:13px;font-weight:700;cursor:pointer}
  .pick.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .pick.off{text-decoration:line-through;opacity:.45;cursor:not-allowed}
  .sheet .wa{margin-top:16px;height:50px;font-size:14.5px;border-radius:14px}
  .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);
    font-size:18px;cursor:pointer;display:grid;place-items:center;color:#334155}
  @media (max-width:760px){
    .sheet{grid-template-columns:1fr;max-height:94vh}
    .sheet-img{min-height:240px;max-height:300px}
    .sheet-body{padding:18px 18px 22px}
    .sheet-body h2{font-size:23px}
    .sheet-price{font-size:25px}
  }

  .sheet-extra{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:5px}
  .sheet-extra div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
  .sheet-extra span{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
  .sheet-extra b{font-weight:700}
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="burger" id="burger" aria-label="Menú">☰</button>
    <div class="logo" id="brandLogo">Zo<span>Co</span></div>
    <div class="searchbox">
      <span style="color:var(--muted)">🔍</span>
      <input id="q" placeholder="Buscar productos, marca o modelo…">
    </div>
    <div class="links">
      <a href="#catalogo">Catálogo</a>
      <a href="#" id="wa-link-top">Contacto</a>
      <a class="icon-btn" id="wa-top" href="#" aria-label="WhatsApp">🟢</a>
    </div>
    <div class="theme-wrap">
      <button class="icon-btn" id="theme-btn" aria-label="Cambiar tema">🎨</button>
      <div class="themes" id="themes"></div>
    </div>
    <a class="icon-btn" id="wa-mob" href="#" aria-label="Bolsa">🛍</a>
  </div>
</header>

<section class="hero">
  <div class="hero-in">
    <div>
      <h1>Encuentra tu<br>próximo favorito</h1>
      <p id="heroSub">Calzado y accesorios para todos los días</p>
    </div>
    <div class="hero-art" id="heroArt"></div>
  </div>
</section>

<div class="wrap" id="catalogo">
  <div class="filters" id="cats"></div>
  <div class="adv">
    <select id="f-color"><option value="">Todos los colores</option></select>
    <select id="f-size"><option value="">Todas las tallas</option></select>
    <button class="chip-x" id="clear" style="display:none">✕ Limpiar filtros</button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<a class="fab" id="wa-fab" href="#" aria-label="WhatsApp">💬</a>

<div class="ov" id="ov">
  <div class="sheet" id="sheet">
    <button class="x" id="ov-x" aria-label="Cerrar">✕</button>
    <div class="sheet-img" id="sheet-img"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const money = (n) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n || 0);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const colorOf = (p) => (p.color && !/^#/.test(p.color) ? p.color : '');

/* ---------- Temas ---------- */
const THEMES = [
  { id: 'claro',   name: 'Claro',   dot: '#FFFFFF', meta: '#FFFFFF' },
  { id: 'cafe',    name: 'Café',    dot: '#F7F1E8', meta: '#F7F1E8' },
  { id: 'rosa',    name: 'Rosa',    dot: '#FFD1E3', meta: '#FFF6F9' },
  { id: 'naranja', name: 'Naranja', dot: '#FFC48A', meta: '#FFF8F1' },
  { id: 'menta',   name: 'Menta',   dot: '#A7E8CF', meta: '#F2FBF7' },
  { id: 'noche',   name: 'Noche',   dot: '#1E293B', meta: '#0F172A' },
];
function applyTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  document.documentElement.dataset.theme = t.id;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.meta);
  localStorage.setItem('zoco.cat.theme', t.id);
  document.querySelectorAll('.sw').forEach((b) => b.classList.toggle('on', b.dataset.t === t.id));
}
$('#themes').innerHTML = THEMES.map((t) =>
  `<button class="sw" data-t="${t.id}" title="${t.name}" style="background:${t.dot}"></button>`).join('');
$('#themes').querySelectorAll('.sw').forEach((b) => b.onclick = () => {
  applyTheme(b.dataset.t);
  $('#themes').classList.remove('open');
});
$('#theme-btn').onclick = (e) => { e.stopPropagation(); $('#themes').classList.toggle('open'); };
document.addEventListener('click', (e) => { if (!e.target.closest('.theme-wrap')) $('#themes').classList.remove('open'); });
applyTheme(localStorage.getItem('zoco.cat.theme') || 'claro');

let state = null;
let PUBLIC_MODE = false;
let cat = 'all', color = '', size = '', q = '';
const favs = new Set(JSON.parse(localStorage.getItem('zoco.cat.favs') || '[]'));

function waNumber() {
  const raw = state?.settings?.whatsapp || state?.company?.whatsapp || state?.company?.phone || '';
  const digits = String(raw).replace(/\D/g, '');
  return digits ? (digits.length === 10 ? '52' + digits : digits) : '';
}
function waLink(text) {
  const n = waNumber();
  // si el negocio no tiene número, WhatsApp deja elegir el contacto
  return n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
}

async function load() {
  // 1) Catálogo público (funciona desde cualquier celular)
  const paramC = new URLSearchParams(location.search).get('c') || '';
  const tryPublic = async (id) => {
    if (!id) return null;
    try {
      const r = await fetch('/api/catalog?c=' + encodeURIComponent(id), { cache: 'no-store' });
      if (!r.ok) return null;
      const j = await r.json();
      if (!j || !j.ok || !Array.isArray(j.products)) return null;
      return j;
    } catch { return null; }
  };
  const pub = await tryPublic(paramC);
  if (pub) {
    state = {
      company: { name: pub.company?.name || 'ZoCo', phone: '', theme: pub.company?.theme, mode: pub.company?.mode },
      settings: { whatsapp: pub.whatsapp || '', ticket: pub.ticket || {} },
      products: pub.products.map((p) => ({ ...p, active: true, catalog: true })),
      branches: [], currentBranch: '',
    };
    PUBLIC_MODE = true;
  }
  // 2) Servidor local, 3) memoria del navegador
  if (!state) {
    try {
      const r = await fetch('/api/state?c=default', { cache: 'no-store' });
      if (r.ok) state = await r.json();
    } catch {}
  }
  if (!state) { try { state = JSON.parse(localStorage.getItem('zoco.pos.v1') || 'null'); } catch {} }
  if (!state || !Array.isArray(state.products)) {
    $('#grid').innerHTML = '<div class="empty">No hay catálogo disponible.<br><small>Configura tu inventario en ZoCo POS.</small></div>';
    return;
  }
  const tienda = (state.company?.name || 'ZoCo').trim();
  document.title = tienda + ' · Catálogo';
  // El nombre de la tienda manda en el catálogo (nada de "ZoCo" fijo)
  try {
    const logo = document.getElementById('brandLogo');
    if (logo && tienda) {
      const partes = tienda.split(/\s+/);
      if (partes.length > 1) {
        logo.innerHTML = partes.slice(0, -1).join(' ') + ' <span>' + partes[partes.length - 1] + '</span>';
      } else {
        logo.innerHTML = tienda.length > 3
          ? tienda.slice(0, -2) + '<span>' + tienda.slice(-2) + '</span>'
          : tienda;
      }
    }
    const sub = document.getElementById('heroSub');
    if (sub && tienda) sub.textContent = 'Bienvenido a ' + tienda;
  } catch {}
  $('#wa-link-top').href = waLink('Hola, vi su catálogo y quiero información');
  $('#wa-top').href = $('#wa-link-top').href;
  $('#wa-mob').href = $('#wa-link-top').href;
  $('#wa-fab').href = $('#wa-link-top').href;
  $('#wa-fab').style.display = waNumber() ? 'grid' : 'none';
  renderHero();
  renderCats();
  renderFilters();
  render();
}

function products() {
  return (state.products || []).filter((p) => p.catalog !== false && p.active !== false);
}
function stockMap(p) { return Object.values(p.branchStock || {})[0] || {}; }
function allSizes(p) { return Object.keys(stockMap(p)); }
function sizesOf(p) { return allSizes(p).filter((k) => Number(stockMap(p)[k]) > 0); }

function renderHero() {
  const withImg = products().filter((p) => p.image).slice(0, 3);
  const art = $('#heroArt');
  if (!withImg.length) { art.innerHTML = '<div class="ph">👟</div><div class="ph">👜</div>'; return; }
  art.innerHTML = withImg.map((p) => `<img src="${p.image}" alt="${esc(p.name)}">`).join('');
}

function renderCats() {
  const secs = [...new Set(products().map((p) => p.section).filter(Boolean))];
  $('#cats').innerHTML = `<button class="pill ${cat === 'all' ? 'on' : ''}" data-c="all">Todo</button>`
    + secs.map((s) => `<button class="pill ${cat === s ? 'on' : ''}" data-c="${esc(s)}">${esc(cap(s))}</button>`).join('');
  $('#cats').querySelectorAll('.pill').forEach((b) => b.onclick = () => { cat = b.dataset.c; renderCats(); render(); });
}

function renderFilters() {
  const colors = [...new Set(products().map((p) => colorOf(p).trim()).filter(Boolean))].sort();
  $('#f-color').innerHTML = '<option value="">Todos los colores</option>' + colors.map((c) => `<option ${color === c ? 'selected' : ''} value="${esc(c)}">${esc(c)}</option>`).join('');
  const sizeList = [...new Set(products().flatMap(sizesOf))].sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
  $('#f-size').innerHTML = '<option value="">Todas las tallas</option>' + sizeList.map((s) => `<option ${size === s ? 'selected' : ''} value="${esc(s)}">Talla ${esc(s)}</option>`).join('');
}

$('#f-color').onchange = (e) => { color = e.target.value; render(); };
$('#f-size').onchange = (e) => { size = e.target.value; render(); };
$('#q').oninput = (e) => { q = e.target.value.toLowerCase().trim(); render(); };
$('#clear').onclick = () => { cat = 'all'; color = ''; size = ''; q = ''; $('#q').value = ''; renderCats(); renderFilters(); render(); };

function render() {
  const list = products().filter((p) => {
    if (cat !== 'all' && p.section !== cat) return false;
    if (color && colorOf(p).trim() !== color) return false;
    if (size && !sizesOf(p).includes(size)) return false;
    if (q) {
      const hay = `${p.name} ${p.code || ''} ${p.color || ''} ${p.section || ''} ${p.brand || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  $('#count').textContent = `${list.length} producto${list.length === 1 ? '' : 's'}` + (color ? ` · ${color}` : '') + (size ? ` · talla ${size}` : '');
  $('#clear').style.display = (cat !== 'all' || color || size || q) ? 'inline-block' : 'none';

  $('#grid').innerHTML = list.length ? list.map((p) => {
    const ini = (p.name || 'Z').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const sizes = sizesOf(p);
    const wa = waLink(`Hola, me interesa "${p.name}" (${money(p.price)}). ¿Está disponible?`);
    const on = favs.has(p.id);
    return `
      <article class="card">
        <div class="pic" data-open="${esc(p.id)}" style="cursor:pointer">
          ${p.image ? `<img src="${p.image}" alt="${esc(p.name)}" loading="lazy">` : `<div class="ini">${esc(ini)}</div>`}
          <button class="heart ${on ? 'on' : ''}" data-fav="${esc(p.id)}" aria-label="Favorito">${on ? '♥' : '♡'}</button>
        </div>
        <div class="body">
          <div class="name" data-open="${esc(p.id)}" style="cursor:pointer">${esc(p.name)}</div>
          <div class="sub">${esc(cap(p.section || 'General'))}${colorOf(p) ? ' · ' + esc(colorOf(p)) : ''}</div>
          <div class="price">${money(p.price)}</div>
          <div class="sizes">${allSizes(p).length
            ? allSizes(p).slice(0, 8).map((s) => `<span class="${Number(stockMap(p)[s]) > 0 ? '' : 'out'}">${esc(s)}</span>`).join('')
            : '<span class="none">Pregunta disponibilidad</span>'}</div>
          <a class="wa" href="${wa}" target="_blank" rel="noopener">
            <span>💬</span> <span class="wa-full">Consultar por</span> <b>WhatsApp</b>
          </a>
        </div>
      </article>`;
  }).join('') : '<div class="empty">No encontramos productos con esos filtros.<br><small>Prueba con otra talla, color o modelo.</small></div>';

  $('#grid').querySelectorAll('[data-open]').forEach((n) => n.onclick = () => openDetail(n.dataset.open));
  $('#grid').querySelectorAll('[data-fav]').forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    const id = b.dataset.fav;
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    localStorage.setItem('zoco.cat.favs', JSON.stringify([...favs]));
    render();
  });
}

/* ---------- Ficha de producto ---------- */
let picked = null;

function openDetail(id) {
  const p = products().find((x) => x.id === id);
  if (!p) return;
  picked = null;

  const ini = (p.name || 'Z').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  $('#sheet-img').innerHTML = p.image
    ? `<img src="${p.image}" alt="${esc(p.name)}">`
    : `<div class="ini">${esc(ini)}</div>`;

  const sizes = allSizes(p);
  const stock = stockMap(p);
  const avail = sizes.filter((s) => Number(stock[s]) > 0);

  $('#sheet-body').innerHTML = `
    <h2>${esc(p.name)}</h2>
    <div class="sheet-cat">${esc(cap(p.section || 'General'))}${colorOf(p) ? ' · ' + esc(colorOf(p)) : ''}${p.code ? ' · ' + esc(p.code) : ''}</div>
    <div class="sheet-price">${money(p.price)}</div>
    ${p.desc ? `<div class="sheet-desc">${esc(p.desc)}</div>` : ''}
    ${(() => {
      const cf = (state.settings?.customFields || []).filter((f) => (p.extra || {})[f.id]);
      if (!cf.length) return '';
      return `<div class="sheet-extra">${cf.map((f) => `<div><span>${esc(f.label)}</span><b>${esc(p.extra[f.id])}</b></div>`).join('')}</div>`;
    })()}
    ${sizes.length ? `
      <div class="lbl">Elige tu talla</div>
      <div class="picks" id="picks">
        ${sizes.map((s) => {
          const n = Number(stock[s]) || 0;
          return `<button class="pick ${n > 0 ? '' : 'off'}" data-sz="${esc(s)}" ${n > 0 ? '' : 'disabled'}
            title="${n > 0 ? n + ' disponibles' : 'agotada'}">${esc(s)}</button>`;
        }).join('')}
      </div>
      <div class="sheet-desc" id="stockinfo">${avail.length ? avail.length + ' tallas disponibles' : 'Sin stock por ahora'}</div>
    ` : ''}
    <a class="wa" id="sheet-wa" href="${waLink(`Hola, me interesa "${p.name}" (${money(p.price)}). ¿Está disponible?`)}" target="_blank" rel="noopener">
      <span>💬</span> <span class="wa-full">Pedir por</span> <b>WhatsApp</b>
    </a>`;

  const picks = $('#picks');
  if (picks) picks.querySelectorAll('.pick').forEach((b) => b.onclick = () => {
    picked = b.dataset.sz;
    picks.querySelectorAll('.pick').forEach((x) => x.classList.toggle('on', x === b));
    $('#sheet-wa').href = waLink(`Hola, quiero pedir "${p.name}" talla ${picked} (${money(p.price)}). ¿Está disponible?`);
    const n = Number(stock[picked]) || 0;
    const info = $('#stockinfo');
    if (info) info.textContent = n > 3 ? 'Disponible' : n > 0 ? 'Últimas ' + n + ' piezas' : 'Agotada';
  });

  $('#ov').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  $('#ov').classList.remove('open');
  document.body.style.overflow = '';
}

$('#ov-x').onclick = closeDetail;
$('#ov').onclick = (e) => { if (e.target.id === 'ov') closeDetail(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

$('#burger').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
load();
</script>
</body>
</html>
