<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZoCo · Catálogo</title>
<link rel="icon" href="/zoco-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F7F1E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E8; --card:#FFFFFF; --ink:#2B1D14; --muted:#8A7A6D;
    --line:#EADFD2; --accent:#3B2416; --green:#25D366; --soft:#F1E7DA;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:90px}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:40;background:rgba(247,241,232,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .bar{max-width:1280px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:16px}
  .logo{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1}
  .logo span{color:var(--accent)}
  .searchbox{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:11px 16px;min-width:0}
  .searchbox input{border:0;outline:0;font-size:14px;width:100%;background:transparent;color:var(--ink)}
  .searchbox input::placeholder{color:#B3A495}
  .links{display:flex;align-items:center;gap:18px;font-size:13.5px;font-weight:600;color:#5C4A3C}
  .links a{color:inherit;text-decoration:none}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;
    display:grid;place-items:center;cursor:pointer;font-size:16px;color:var(--ink);text-decoration:none}
  .burger{display:none}
  #wa-mob{display:none}

  /* ---------- Hero ---------- */
  .hero{max-width:1280px;margin:0 auto;padding:0 18px}
  .hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:10px;align-items:center;
    background:linear-gradient(100deg,#EFE3D3,#F7EFE4 60%,#EFE3D3);border-radius:0 0 22px 22px;
    padding:34px 34px;overflow:hidden}
  .hero h1{font-family:'Playfair Display',Georgia,serif;font-size:44px;line-height:1.05;letter-spacing:-1px;margin-bottom:10px}
  .hero p{font-size:15px;color:#6B5849;max-width:380px}
  .hero-art{display:flex;justify-content:flex-end;gap:10px;align-items:flex-end}
  .hero-art img{width:120px;height:120px;object-fit:cover;border-radius:16px;box-shadow:0 10px 24px rgba(59,36,22,.12);background:#fff}
  .hero-art .ph{width:120px;height:120px;border-radius:16px;background:linear-gradient(140deg,#D9C3A9,#C6A98A);
    display:grid;place-items:center;font-size:34px;color:#fff}

  /* ---------- Filtros ---------- */
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px}
  .filters::-webkit-scrollbar{height:0}
  .pill{white-space:nowrap;border:1px solid var(--line);background:#F3EADF;color:#5C4A3C;border-radius:999px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .adv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
  .adv select{height:38px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);
    font-size:13px;padding:0 14px;font-weight:600;cursor:pointer}
  .chip-x{border:0;background:var(--soft);color:#6B5849;border-radius:999px;padding:8px 12px;font-size:12px;
    font-weight:700;cursor:pointer}
  .count{font-size:12.5px;color:var(--muted);margin:6px 0 12px}

  /* ---------- Grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;
    flex-direction:column;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(59,36,22,.08)}
  .pic{position:relative;aspect-ratio:1/1;background:linear-gradient(140deg,#EFE3D3,#DCC9B3);display:grid;place-items:center}
  .pic img{width:100%;height:100%;object-fit:cover}
  .pic .ini{font-family:'Playfair Display',serif;font-size:44px;color:#fff;opacity:.92}
  .heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);
    display:grid;place-items:center;cursor:pointer;font-size:15px;color:#5C4A3C}
  .heart.on{color:#E11D48}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .name{font-family:'Playfair Display',Georgia,serif;font-size:18px;line-height:1.2}
  .sub{font-size:12.5px;color:var(--muted)}
  .price{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.4px}
  .sizes{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 10px}
  .sizes span{font-size:11px;font-weight:700;color:#6B5849;background:var(--soft);border-radius:7px;padding:3px 7px}
  .sizes .none{background:transparent;color:#B3A495;font-weight:600}
  .wa{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border:1.5px solid #25D366;color:#128C4A;font-size:13.5px;font-weight:700;text-decoration:none;background:#fff}
  .wa:hover{background:#F0FDF4}
  .wa b{font-weight:700}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}

  /* ---------- WhatsApp flotante ---------- */
  .fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--green);
    color:#fff;display:grid;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 12px 28px rgba(37,211,102,.45);z-index:50}

  @media (max-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} .hero-in{grid-template-columns:1fr} .hero-art{display:none} }
  @media (max-width:760px){
    .bar{padding:12px 14px;gap:10px;display:grid;
      grid-template-columns:auto 1fr auto;grid-template-areas:"burger logo bag" "search search search";row-gap:10px;align-items:center}
    .burger{display:grid;place-items:center;width:34px;height:34px;border:0;background:none;font-size:20px;cursor:pointer;grid-area:burger}
    .logo{font-size:24px;text-align:center;grid-area:logo}
    .links{display:none}
    .searchbox{grid-area:search;width:100%}
    #wa-mob{display:grid;grid-area:bag;margin:0;justify-self:end}

    .hero{padding:0 14px}
    .hero-in{padding:22px 20px;border-radius:16px;margin-top:12px}
    .hero h1{font-size:31px}
    .hero p{font-size:13.5px}
    .wrap{padding:0 14px}
    .filters{padding:14px 0 4px;gap:7px}
    .pill{padding:9px 16px;font-size:13px}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .body{padding:11px 12px 13px}
    .name{font-size:15.5px}
    .sub{font-size:11px}
    .price{font-size:17px}
    .sizes span{font-size:10px;padding:2px 6px}
    .wa{height:38px;font-size:11px;border-radius:10px;gap:4px;padding:0 6px}
    .wa-full{display:none}
    .wa span{font-size:12px}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="burger" id="burger" aria-label="Menú">☰</button>
    <div class="logo">Zo<span>Co</span></div>
    <div class="searchbox">
      <span style="color:#B3A495">🔍</span>
      <input id="q" placeholder="Buscar productos, marca o modelo…">
    </div>
    <div class="links">
      <a href="#catalogo">Catálogo</a>
      <a href="#" id="wa-link-top">Contacto</a>
      <a class="icon-btn" id="wa-top" href="#" aria-label="WhatsApp">🟢</a>
    </div>
    <a class="icon-btn" id="wa-mob" href="#" style="margin-left:auto" aria-label="WhatsApp">🛍</a>
  </div>
</header>

<section class="hero">
  <div class="hero-in">
    <div>
      <h1>Encuentra tu<br>próximo favorito</h1>
      <p>Calzado y accesorios para todos los días</p>
    </div>
    <div class="hero-art" id="heroArt"></div>
  </div>
</section>

<div class="wrap" id="catalogo">
  <div class="filters" id="cats"></div>
  <div class="adv">
    <select id="f-color"><option value="">Todos los colores</option></select>
    <select id="f-size"><option value="">Todas las tallas</option></select>
    <button class="chip-x" id="clear" style="display:none">✕ Limpiar filtros</button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<a class="fab" id="wa-fab" href="#" aria-label="WhatsApp">💬</a>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n || 0);
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

let state = null;
let cat = 'all', color = '', size = '', q = '';
const favs = new Set(JSON.parse(localStorage.getItem('zoco.cat.favs') || '[]'));

// WhatsApp del negocio (se toma de la configuración)
function waNumber() {
  const raw = state?.company?.phone || state?.settings?.whatsapp || '';
  const digits = String(raw).replace(/\D/g, '');
  return digits ? (digits.length === 10 ? '52' + digits : digits) : '';
}
function waLink(text) {
  const n = waNumber();
  return n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : '#';
}

async function load() {
  try {
    const r = await fetch('/api/state?c=default', { cache: 'no-store' });
    if (r.ok) state = await r.json();
  } catch {}
  if (!state) { try { state = JSON.parse(localStorage.getItem('zoco.pos.v1') || 'null'); } catch {} }
  if (!state || !Array.isArray(state.products)) {
    $('#grid').innerHTML = '<div class="empty">No hay catálogo disponible.<br><small>Configura tu inventario en ZoCo POS.</small></div>';
    return;
  }
  document.title = (state.company?.name || 'ZoCo') + ' · Catálogo';
  $('#wa-link-top').href = waLink('Hola, vi su catálogo y quiero información');
  $('#wa-top').href = $('#wa-link-top').href;
  $('#wa-mob').href = $('#wa-link-top').href;
  $('#wa-fab').href = $('#wa-link-top').href;
  $('#wa-fab').style.display = waNumber() ? 'grid' : 'none';
  renderHero();
  renderCats();
  renderFilters();
  render();
}

const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const colorOf = (p) => (p.color && !/^#/.test(p.color) ? p.color : '');

function products() {
  return (state.products || []).filter((p) => p.catalog !== false && p.active !== false);
}

function sizesOf(p) {
  const stock = Object.values(p.branchStock || {})[0] || {};
  return Object.keys(stock).filter((k) => Number(stock[k]) > 0);
}

function renderHero() {
  const withImg = products().filter((p) => p.image).slice(0, 3);
  const art = $('#heroArt');
  if (!withImg.length) { art.innerHTML = '<div class="ph">👟</div><div class="ph">👜</div>'; return; }
  art.innerHTML = withImg.map((p) => `<img src="${p.image}" alt="${esc(p.name)}">`).join('');
}

function renderCats() {
  const secs = [...new Set(products().map((p) => p.section).filter(Boolean))];
  $('#cats').innerHTML = `<button class="pill ${cat === 'all' ? 'on' : ''}" data-c="all">Todo</button>`
    + secs.map((s) => `<button class="pill ${cat === s ? 'on' : ''}" data-c="${esc(s)}">${esc(s.charAt(0).toUpperCase() + s.slice(1))}</button>`).join('');
  $('#cats').querySelectorAll('.pill').forEach((b) => b.onclick = () => { cat = b.dataset.c; renderCats(); render(); });
}

function renderFilters() {
  const colors = [...new Set(products().map((p) => colorOf(p).trim()).filter(Boolean))].sort();
  $('#f-color').innerHTML = '<option value="">Todos los colores</option>' + colors.map((c) => `<option ${color === c ? 'selected' : ''} value="${esc(c)}">${esc(c)}</option>`).join('');

  const allSizes = [...new Set(products().flatMap(sizesOf))]
    .sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
  $('#f-size').innerHTML = '<option value="">Todas las tallas</option>' + allSizes.map((s) => `<option ${size === s ? 'selected' : ''} value="${esc(s)}">Talla ${esc(s)}</option>`).join('');
}

$('#f-color').onchange = (e) => { color = e.target.value; render(); };
$('#f-size').onchange = (e) => { size = e.target.value; render(); };
$('#q').oninput = (e) => { q = e.target.value.toLowerCase().trim(); render(); };
$('#clear').onclick = () => { cat = 'all'; color = ''; size = ''; q = ''; $('#q').value = ''; renderCats(); renderFilters(); render(); };

function render() {
  const list = products().filter((p) => {
    if (cat !== 'all' && p.section !== cat) return false;
    if (color && colorOf(p).trim() !== color) return false;
    if (size && !sizesOf(p).includes(size)) return false;
    if (q) {
      const hay = `${p.name} ${p.code || ''} ${p.color || ''} ${p.section || ''} ${p.brand || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  $('#count').textContent = `${list.length} producto${list.length === 1 ? '' : 's'}` + (color ? ` · ${color}` : '') + (size ? ` · talla ${size}` : '');
  $('#clear').style.display = (cat !== 'all' || color || size || q) ? 'inline-block' : 'none';

  $('#grid').innerHTML = list.length ? list.map((p) => {
    const ini = (p.name || 'Z').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const sizes = sizesOf(p);
    const wa = waLink(`Hola, me interesa "${p.name}" (${money(p.price)}). ¿Está disponible?`);
    const on = favs.has(p.id);
    return `
      <article class="card">
        <div class="pic">
          ${p.image ? `<img src="${p.image}" alt="${esc(p.name)}" loading="lazy">` : `<div class="ini">${esc(ini)}</div>`}
          <button class="heart ${on ? 'on' : ''}" data-fav="${esc(p.id)}" aria-label="Favorito">${on ? '♥' : '♡'}</button>
        </div>
        <div class="body">
          <div class="name">${esc(p.name)}</div>
          <div class="sub">${esc(cap(p.section || 'General'))}${colorOf(p) ? ' · ' + esc(colorOf(p)) : ''}</div>
          <div class="price">${money(p.price)}</div>
          <div class="sizes">${sizes.length
            ? sizes.slice(0, 7).map((s) => `<span>${esc(s)}</span>`).join('')
            : '<span class="none">Pregunta disponibilidad</span>'}</div>
          <a class="wa" href="${wa}" target="_blank" rel="noopener">
            <span>💬</span> <span class="wa-full">Consultar por</span> <b style="font-weight:700">WhatsApp</b>
          </a>
        </div>
      </article>`;
  }).join('') : '<div class="empty">No encontramos productos con esos filtros.<br><small>Prueba con otra talla, color o modelo.</small></div>';

  $('#grid').querySelectorAll('[data-fav]').forEach((b) => b.onclick = () => {
    const id = b.dataset.fav;
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    localStorage.setItem('zoco.cat.favs', JSON.stringify([...favs]));
    render();
  });
}

$('#burger').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
load();
</script>
</body>
</html>
